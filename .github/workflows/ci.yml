name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Testes (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Executar suíte de testes unitários
        shell: bash
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Executar auditor independente SQLite
        shell: bash
        run: |
          python tools/verify_independent.py

  packaging:
    name: Empacotamento e Verificação Isolada de Rede
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar ferramentas de build
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Construir distribuições (sdist e wheel)
        run: |
          python -m build

      - name: Testar instalação e isolamento total de rede
        run: |
          python -m venv venv_teste
          source venv_teste/bin/activate
          pip install dist/*.whl
          unshare -r -n sapatas-concreto --help
          unshare -r -n sapatas-concreto tabelas
          unshare -r -n sapatas-concreto materiais
          unshare -r -n sapatas-concreto versao
          unshare -r -n sapatas-concreto dimensionar -a examples/sapata_residencial_pilar_retangular.json
          deactivate
